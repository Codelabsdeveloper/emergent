services:
  - type: web
    name: emergent-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: emergent-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_USERNAME
        value: Emergent
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: emergent-db
    plan: free
